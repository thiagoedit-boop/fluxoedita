<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FluxoEDITÁ</title>
<meta name="description" content="Criação de conteúdo do Thiago Editá: blocos, vídeos, roteiro, gravação, edição e mesa livre.">
<meta name="theme-color" content="#0E0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FluxoEDITÁ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<style>
@font-face{font-family:"Unbounded";src:url("fonts/Unbounded-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Unbounded";src:url("fonts/Unbounded-ExtraBold.ttf") format("truetype");font-weight:800;font-display:swap}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
/* no app do Mac os botões da janela ficam por cima do topo da barra lateral */
.mac #lado{padding-top:44px}
.mac .topo{padding-top:22px}
/* Layout: casca escura de estúdio (lateral + topo) e, no meio, o painel de furinhos onde os cartões de papel ficam pregados. */
:root{
  --tinta:#0E0E10; --painel:#151518; --cartao:#1B1B1F; --cartao-2:#232327; --linha:#2A2A2F;
  --texto:#F2F0EB; --texto-2:#C9C7CC; --texto-3:#8E8C93;
  --vermelho:#E3122B; --vermelho-esc:#B80B20; --vermelho-claro:#FF6070;
  --papel:#FBFAF7; --papel-2:#E6E2DA; --papel-tinta:#17171A; --papel-sub:#5E5B55;
  --furo:#D6D1C8; --nota:#FFE9A8; --verde:#2FA36B; --laranja:#FF8A2A; --azul:#2F5FC4;
  --f-titulo:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-texto:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--tinta);color:var(--texto);font:14px/1.45 var(--f-texto);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--vermelho-claro)}
.estado-salvo{text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vermelho-claro);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.etq{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}
.pontos{background-color:var(--furo);background-image:radial-gradient(circle at 50% 50%,#8F8A80 0,#A7A196 1.6px,rgba(255,255,255,.55) 2.6px,transparent 3.2px),linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.05));background-size:26px 26px,100% 100%}

/* casca */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
#lado{background:var(--tinta);border-right:1px solid var(--linha);padding:20px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none;color:var(--texto)}
.marca i{width:26px;height:26px;border-radius:7px;background:var(--vermelho);display:grid;place-items:center;flex:none}
.marca i::after{content:"";width:10px;height:10px;border:2px solid var(--tinta);border-radius:2px}
.marca b{font:800 16px var(--f-titulo);letter-spacing:-.4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .etq{color:var(--texto-3);padding:12px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--texto-2);text-decoration:none;min-height:40px}
.nav a:hover{background:var(--cartao)}
.nav a.ativo{background:var(--cartao);color:var(--texto);font-weight:600}
.nav a .q{width:8px;height:8px;border-radius:2px;flex:none}
.nav a span.n{margin-left:auto;font:500 12px var(--f-mono);color:var(--texto-3)}
.estado-salvo{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texto-3);padding:10px;border-radius:10px;background:var(--painel);border:1px solid var(--linha)}
.estado-salvo i{width:8px;height:8px;border-radius:50%;background:var(--verde);flex:none}
.estado-salvo.salvando i{background:var(--laranja)}
.estado-salvo.erro i,.estado-salvo.teste i{background:var(--vermelho)}
#principal{min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
#vista{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}

/* topo de cada tela */
.topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 14px 24px;border-bottom:1px solid var(--linha);background:var(--tinta);position:sticky;top:0;z-index:5}
.topo-esq{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 320px}
.voltar{width:40px;height:40px;border-radius:10px;background:var(--cartao);display:grid;place-items:center;color:var(--texto);text-decoration:none;flex:none}
.trilha{font-size:12px;color:var(--texto-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilha a{color:var(--texto-3);text-decoration:none}.trilha a:hover{color:var(--texto)}
.titulo{font:700 22px/1.15 var(--f-titulo);letter-spacing:-.6px;margin:0;text-wrap:balance}
input.titulo{background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;width:100%;min-width:0}
input.titulo:hover{border-color:var(--linha)}input.titulo:focus{border-color:var(--vermelho);outline:none;background:var(--painel)}
.topo-dir{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--linha);background:var(--cartao);color:var(--texto);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#3A3A40}
.btn.prim{background:var(--vermelho);border-color:var(--vermelho);color:#fff}.btn.prim:hover{background:var(--vermelho-esc)}
.btn.fantasma{background:transparent}
.btn.perigo{color:var(--vermelho-claro)}
.btn.peq{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
select.sel{min-height:40px;border-radius:10px;border:1px solid var(--linha);background:var(--cartao);padding:0 10px}
.abas{display:flex;gap:4px;padding:4px;background:var(--painel);border:1px solid var(--linha);border-radius:12px;flex-wrap:wrap}
.abas a{padding:7px 12px;border-radius:9px;color:var(--texto-2);text-decoration:none;font-weight:500}
.abas a.ativa{background:var(--vermelho);color:#fff;font-weight:600}
.barra-abas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 24px;border-bottom:1px solid var(--linha)}

/* superfície de furinhos */
.chapa{flex:1;padding:26px max(16px,env(safe-area-inset-right,0px)) 40px 24px;color:var(--papel-tinta)}
.chapa,.papel,.mesa-area,.cartao-it{color-scheme:light}
.papel{background:var(--papel);color:var(--papel-tinta);border-radius:14px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 12px 24px rgba(40,32,20,.2)}
.vazio{max-width:520px;padding:22px;border-radius:14px;background:rgba(255,255,255,.45);border:2px dashed #8F8A80;color:#3A372F}
.vazio h2{margin:0 0 6px;font:700 18px var(--f-titulo);letter-spacing:-.3px}
.vazio p{margin:0}

/* quadro geral */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 22px;align-items:start}
.bloco-cartao{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;text-decoration:none}
.bloco-cartao .prego{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.bloco-cartao h2{margin:0;font:700 21px var(--f-titulo);letter-spacing:-.5px;text-wrap:balance;overflow-wrap:anywhere}
.bloco-cartao .linha-v{display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.bloco-cartao .linha-v span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--papel-sub)}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--papel-2);color:#3A383E;white-space:nowrap}
.chip.ideia{background:#ECE8E0;color:#6B6862}.chip.roteiro{background:#FFE3C2;color:#8A4A0F}.chip.gravacao{background:var(--vermelho);color:#fff}
.chip.edicao{background:#17171A;color:#F2F0EB}.chip.publicado{background:#D6F0E1;color:#1F7A4E}
.novo-bloco{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;border:2px dashed #8F8A80;background:rgba(255,255,255,.3);color:#3A372F}
.novo-bloco input{min-height:42px;border-radius:10px;border:1px solid #B9B4AA;background:var(--papel);color:var(--papel-tinta);padding:0 12px}
.tipo-btn{min-height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;border:1px solid #B9B4AA;background:var(--papel);color:var(--papel-tinta);text-align:left;font-weight:500}
.tipo-btn:hover{border-color:var(--papel-tinta)}
.tipo-btn i{width:9px;height:9px;border-radius:2px;flex:none}

/* bloco de conteúdo: colunas por subnicho */
.colunas{display:flex;gap:20px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.sn{flex:0 0 280px;display:flex;flex-direction:column;gap:10px}
.sn-cab{display:flex;align-items:center;gap:6px}
.sn-cab input{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#3A372F}
.sn-cab input:focus{border-color:#8F8A80;outline:none;background:rgba(255,255,255,.5)}
.sn-cab .n{font-size:12px;color:#4F4B44}
.x{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:inherit;opacity:.55;display:grid;place-items:center;flex:none}
.x:hover{opacity:1;background:rgba(0,0,0,.08)}
.video-cartao{display:flex;flex-direction:column;gap:10px;padding:14px;text-decoration:none}
.video-cartao b{font-weight:600;overflow-wrap:anywhere}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.etapas span{font-size:11px;font-weight:600;text-align:center;padding:5px 0;border-radius:6px;background:var(--papel-2);color:#6B6862}
.etapas .ok{background:#17171A;color:#F2F0EB}.etapas .agora{background:var(--vermelho);color:#fff}
.mais{min-height:42px;border-radius:12px;border:2px dashed #8F8A80;background:rgba(255,255,255,.28);color:#3A372F;font-weight:600}
.mais:hover{background:rgba(255,255,255,.5)}
.sn-novo{flex:0 0 240px;display:flex;flex-direction:column;gap:8px}
.sn-novo input{min-height:42px;border-radius:10px;border:1px solid #B9B4AA;background:var(--papel);color:var(--papel-tinta);padding:0 12px}

/* planilha */
.resumo{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.resumo .papel{flex:1 1 180px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.resumo b{font:500 22px var(--f-mono)}
.tabela-caixa{overflow-x:auto}
table.tab{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tab th{text-align:left;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6B6862;padding:10px;background:#EFECE6;border-bottom:1px solid #DCD7CD}
.tab td{padding:4px 6px;border-bottom:1px solid #ECE8E0}
.tab input,.tab select{width:100%;min-height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--papel-tinta);padding:0 8px}
.tab input:hover,.tab select:hover{border-color:#DCD7CD}.tab input:focus,.tab select:focus{border-color:var(--vermelho);outline:none;background:#fff}
.tab .valor input{text-align:right;font-family:var(--f-mono)}
.mes-nav{display:flex;align-items:center;gap:8px}
.mes-nav b{min-width:150px;text-align:center;font-weight:600}
.verde{color:#1F7A4E}.verm{color:var(--vermelho-esc)}

/* lista */
.lista{max-width:640px;display:flex;flex-direction:column;padding:8px}
.lista label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid #ECE8E0}
.lista input[type=text]{flex:1;min-width:0;min-height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--papel-tinta);padding:0 8px}
.lista input[type=text]:focus{border-color:var(--vermelho);outline:none;background:#fff}
.lista .feito input[type=text]{text-decoration:line-through;color:#8E8C93}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--vermelho);flex:none}
.lista-add{display:flex;gap:8px;padding:10px 8px}
.lista-add input{flex:1;min-width:0;min-height:40px;border-radius:10px;border:1px solid #DCD7CD;background:#fff;color:var(--papel-tinta);padding:0 12px}

/* vídeo: roteiro, gravação, edição */
.duas{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.duas>.principal{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.duas>.aside{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:14px}
.rot{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.rot-cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rot-cab input{flex:1;min-width:160px;font:700 18px var(--f-titulo);letter-spacing:-.4px;background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 6px;color:var(--papel-tinta)}
.rot-cab input:focus{border-color:#DCD7CD;outline:none;background:#fff}
.rot textarea{width:100%;min-height:90px;resize:none;border:1px solid #E6E2DA;border-radius:10px;background:#fff;color:var(--papel-tinta);padding:12px 14px;font-size:16px;line-height:1.65;overflow:hidden}
.rot textarea:focus,.rot input.broll:focus{border-color:var(--vermelho);outline:none}
.rot input.broll{width:100%;min-height:38px;border:1px solid transparent;border-radius:10px;background:var(--papel-2);color:#3A383E;padding:0 12px;font-size:13px}
.tempo{font:500 12px var(--f-mono);color:var(--papel-sub)}
.caixa-escura{background:var(--cartao);color:var(--texto);border:1px solid var(--linha);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.caixa-escura .etq{color:var(--texto-3)}
.caixa-escura textarea{width:100%;min-height:80px;resize:vertical;border-radius:10px;border:1px solid var(--linha);background:var(--painel);padding:10px 12px}
.caixa-escura textarea:focus{border-color:var(--vermelho);outline:none}
.pedido{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--painel);border:1px solid var(--linha)}
.pedido .st{font-size:12px;font-weight:600}
.st.aberto{color:var(--laranja)}.st.andamento{color:var(--vermelho-claro)}.st.feito{color:var(--verde)}
.pedido .resp{font-size:13px;color:var(--texto-2);border-left:2px solid var(--verde);padding-left:8px;white-space:pre-wrap}
.check{display:flex;align-items:center;gap:10px;min-height:34px}
.check input[type=text]{flex:1;min-width:0;min-height:32px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 6px}
.check input[type=text]:focus{border-color:var(--vermelho);outline:none}
.papel .check input[type=text]{color:var(--papel-tinta)}
.check.feito input[type=text]{text-decoration:line-through;opacity:.6}
.take{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #ECE8E0}
.take.feito{background:#F3FAF6;border-color:#CDEBDB}
.take input[type=text]{min-width:0;min-height:34px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--papel-tinta);padding:0 6px}
.take input[type=text]:focus{border-color:var(--vermelho);outline:none}
.take select{min-height:32px;border-radius:8px;border:1px solid #DCD7CD;background:var(--papel);color:var(--papel-tinta);font-size:12px;padding:0 6px}
.reels{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--papel-sub);white-space:nowrap}
.ultimo{font-size:11px;font-weight:600;color:#fff;background:var(--vermelho);padding:2px 7px;border-radius:999px}
.barra{height:6px;border-radius:6px;background:var(--linha);overflow:hidden}.barra i{display:block;height:100%;background:var(--vermelho)}
.papel .barra{background:var(--papel-2)}

/* mesa livre */
.mesa{flex:1;min-height:520px;display:flex;position:relative}
.ferramentas{flex:0 0 74px;display:flex;flex-direction:column;gap:2px;padding:10px 7px;background:var(--painel);border-right:1px solid var(--linha);overflow:auto}
.ferr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;border-radius:10px;background:transparent;color:var(--texto-2);font-size:11px;font-weight:500;touch-action:none;user-select:none}
.ferr:hover{background:var(--cartao);color:var(--texto)}
.ferr.ativa{background:var(--vermelho);color:#fff}
.ferr svg{width:20px;height:20px}
.mesa-rolagem{flex:1;min-width:0;overflow:auto;position:relative}
.mesa-area{position:relative;min-width:100%;touch-action:pan-x pan-y}
.mesa-area.ligando{cursor:crosshair}
.mesa-dica{position:sticky;left:12px;top:12px;display:inline-block;margin:12px;padding:8px 12px;border-radius:10px;background:rgba(14,14,16,.82);color:var(--texto);font-size:12px;z-index:3;pointer-events:none}
.it{position:absolute;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--papel-tinta)}
.it.sel{outline:2px solid var(--vermelho);outline-offset:3px}
.it.de{outline:2px dashed var(--vermelho);outline-offset:3px}
.it .txt{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.4em;outline:none}
.it .txt:empty::before{content:attr(data-vazio);color:#9A968E}
.it [contenteditable="true"],.it [contenteditable="plaintext-only"]{user-select:text;-webkit-user-select:text;cursor:text;background:rgba(255,255,255,.6);border-radius:4px}
.nota{padding:14px 16px;border-radius:3px;box-shadow:0 8px 18px rgba(0,0,0,.22);font-weight:500;line-height:1.45}
.nota.amarela{background:var(--nota)}.nota.branca{background:var(--papel)}.nota.vermelha{background:#FFD3D8}.nota.verde{background:#D6F0E1}.nota.azul{background:#DCE6FA}
.texto-solto .txt{font:800 28px/1.15 var(--f-titulo);letter-spacing:-.8px}
.coluna{background:var(--papel-2);border-radius:12px;padding:0 10px 10px;box-shadow:0 2px 0 rgba(0,0,0,.05),0 12px 24px rgba(40,32,20,.18)}
.coluna>.col-tit{font-weight:700;padding:10px 4px 8px}
.col-corpo{display:flex;flex-direction:column;gap:8px;min-height:44px}
.coluna.alvo{box-shadow:0 0 0 3px var(--vermelho),0 12px 24px rgba(40,32,20,.18)}
.col-corpo>.it{position:relative;left:auto!important;top:auto!important;width:auto!important}
.col-corpo>.nota{box-shadow:0 1px 2px rgba(0,0,0,.15)}
.col-vazia{font-size:12px;color:#7A766F;text-align:center;border:1.5px dashed #A7A196;border-radius:9px;padding:10px}
.cartao-it{background:var(--papel);border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 12px 24px rgba(40,32,20,.2);overflow:hidden}
.imagem img{display:block;width:100%;height:auto;pointer-events:none}
.imagem .txt{padding:8px 12px;font-size:13px}
.form-it{display:flex;flex-direction:column;gap:8px;padding:12px}
.form-it input{min-height:36px;border-radius:8px;border:1px solid #DCD7CD;background:#fff;color:var(--papel-tinta);padding:0 10px;width:100%}
.form-it .btn{color:var(--papel-tinta);background:var(--papel-2);border-color:#DCD7CD}
.link .prev{aspect-ratio:16/9;background:linear-gradient(135deg,#2A2A30,#6A1A10);display:grid;place-items:center;color:#fff;font:700 13px var(--f-titulo);padding:10px;text-align:center}
.link .corpo{padding:10px 12px;display:flex;flex-direction:column;gap:2px}

    if (modo === "carregando" || (modo === "nuvem" && !S.carregou.has("blocos"))) html = erroCarga ? `<div class="carregando">${esc(erroCarga)} Recarregue a página.</div>` : `<div class="carregando">Abrindo seu quadro…</div>`;
    else if (r.tela === "bloco") html = telaBloco(r);
    else if (r.tela === "video") html = telaVideo(r);
    else if (r.tela === "pedidos") html = telaPedidos();
    else if (r.tela === "ajustes") html = telaAjustes();
    else html = telaInicio(r);
    v.innerHTML = html;
    $$("textarea[data-auto]", v).forEach(autoAltura);
    const mesa = $(".mesa", v); if (mesa) montarMesa(mesa);
    const rol2 = $(".mesa-rolagem"); if (rol2) { rol2.scrollLeft = rx; rol2.scrollTop = ry; }
    v.scrollTop = vy;
    $("#faixa").innerHTML = !cfg.token && r.tela !== "ajustes" ? `<div class="faixa">Falta conectar a sincronização com o GitHub. Por enquanto tudo fica só neste aparelho. <a href="#ajustes" style="color:#fff">Abrir Ajustes</a></div>` : "";
  }
  function autoAltura(t) { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }

  const blocosOrdem = () => Object.values(S.blocos).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const videosDe = (bid, sid) => Object.values(S.videos).filter(v => v.bloco === bid && (sid === undefined || (v.subnicho || "") === sid)).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const subsDe = bid => Object.values(S.subnichos).filter(s => s.bloco === bid).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const pedidosAbertos = () => Object.values(S.pedidos).filter(p => p.estado !== "feito");

  function renderLado() {
    const r = rota(); const lado = $("#lado");
    const bl = blocosOrdem();
    const ativoB = r.tela === "bloco" ? r.id : r.tela === "video" ? (S.videos[r.id] || {}).bloco : null;
    const nAbertos = pedidosAbertos().length;
    lado.innerHTML = `
      <a class="marca" href="#inicio"><i aria-hidden="true"></i><b>FluxoEDITÁ</b></a>
      <nav class="nav" aria-label="Blocos">
        <a href="#inicio" class="${r.tela === "inicio" ? "ativo" : ""}">${ICONE.grade}Quadro geral</a>
        <span class="etq">Blocos</span>
        ${bl.map(b => `<a href="#b-${b.id}" class="${ativoB === b.id ? "ativo" : ""}"><i class="q" style="background:${COR_TIPO[b.tipo] || "#8E8C93"}"></i>${esc(b.nome || "Sem nome")}<span class="n">${b.tipo === "conteudo" ? videosDe(b.id).length : b.tipo === "lista" ? ((S.listas[b.id] || {}).itens || []).length : ""}</span></a>`).join("")}
        <span class="etq">Equipe</span>
        <a href="#pedidos" class="${r.tela === "pedidos" ? "ativo" : ""}"><i class="q" style="background:${nAbertos ? "#FF8A2A" : "#5E5C63"};border-radius:50%"></i>Pedidos<span class="n">${nAbertos || ""}</span></a>
        <a href="#ajustes" class="${r.tela === "ajustes" ? "ativo" : ""}"><i class="q" style="background:#5E5C63;border-radius:50%"></i>Ajustes</a>
      </nav>
      <a class="estado-salvo" href="#ajustes" role="status"><i></i><span></span></a>`;
    atualizarSalvo();
  }

  // ---------- quadro geral ----------
  function telaInicio(r) {
    const dataHoje = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    const topo = `<header class="topo"><div class="topo-esq"><div style="min-width:0"><div class="trilha">${esc(dataHoje)}</div><h1 class="titulo">Quadro geral</h1></div></div>
      <div class="abas" role="tablist"><a href="#inicio" class="${r.aba === "blocos" ? "ativa" : ""}">Blocos</a><a href="#inicio-mesa" class="${r.aba === "mesa" ? "ativa" : ""}">Mesa livre</a></div></header>`;
    if (r.aba === "mesa") return topo + htmlMesa("geral");
    const bl = blocosOrdem();
    return topo + `<div class="chapa pontos"><div class="grade">
      ${bl.map(cartaoBloco).join("")}
      <div class="novo-bloco">
        <b>Novo bloco</b>
        <label class="sub" for="novo-bloco-nome">Nome do bloco</label>
        <input id="novo-bloco-nome" type="text" placeholder="${bl.length ? "Ex.: TikTok, Cursos, Casa" : "Ex.: YouTube"}" autocomplete="off">
        <span class="sub">Escolha o que ele vai ser:</span>
        <button class="tipo-btn" data-acao="novoBloco" data-tipo="conteudo"><i style="background:${COR_TIPO.conteudo}"></i>Conteúdo · subnichos e vídeos</button>
        <button class="tipo-btn" data-acao="novoBloco" data-tipo="planilha"><i style="background:${COR_TIPO.planilha}"></i>Planilha · contas e orçamentos</button>
        <button class="tipo-btn" data-acao="novoBloco" data-tipo="lista"><i style="background:${COR_TIPO.lista}"></i>Lista · ideias e tarefas</button>
      </div></div>
      ${bl.length ? "" : `<div class="vazio" style="margin-top:24px"><h2>Seu quadro ainda tá vazio</h2><p>Crie o primeiro bloco aí em cima. Um bloco de conteúdo guarda os subnichos e os vídeos; dentro de cada vídeo tem roteiro, gravação e edição.</p></div>`}
    </div>`;
  }
  function cartaoBloco(b) {
    let corpo = "";
    if (b.tipo === "conteudo") {
      const vs = videosDe(b.id).sort((x, y) => (y.atualizado || "").localeCompare(x.atualizado || ""));
      corpo = vs.length ? vs.slice(0, 3).map(v => `<div class="linha-v"><span>${esc(v.titulo || "Vídeo sem título")}</span><span class="chip ${v.etapa || "ideia"}">${NOME_ETAPA[v.etapa || "ideia"]}</span></div>`).join("") + (vs.length > 3 ? `<span class="sub">+ ${vs.length - 3} vídeos</span>` : "")
        : `<span class="sub">Nenhum vídeo ainda</span>`;
      corpo = `<div class="sub">${subsDe(b.id).length} subnichos · ${vs.length} vídeos</div>` + corpo;
    } else if (b.tipo === "planilha") {
      const t = totaisMes(b.id, S.mes);
      corpo = `<div class="sub">${esc(nomeMes(S.mes))}</div>
        <div class="linha-v"><span>Entrou</span><b class="mono verde">${real(t.ent)}</b></div>
        <div class="linha-v"><span>Saiu</span><b class="mono verm">${real(t.sai)}</b></div>
        <div class="linha-v" style="border-top:1px solid #E0DCD3;padding-top:6px"><b>Sobrou</b><b class="mono">${real(t.ent - t.sai)}</b></div>`;
    } else {
      const it = (S.listas[b.id] || {}).itens || [];
      corpo = it.length ? it.slice(0, 4).map(i => `<div class="linha-v"><span style="${i.ok ? "text-decoration:line-through;color:#8E8C93" : ""}">· ${esc(i.t)}</span></div>`).join("") : `<span class="sub">Lista vazia</span>`;
      corpo = `<div class="sub">${it.filter(i => !i.ok).length} abertos · ${it.length} no total</div>` + corpo;
    }
    return `<a class="papel bloco-cartao" href="#b-${b.id}"><span class="prego" style="background:${COR_TIPO[b.tipo]}"></span>
      <span class="etq" style="color:${b.tipo === "conteudo" ? "#B80B20" : b.tipo === "planilha" ? "#1F7A4E" : "#55535A"}">${NOME_TIPO[b.tipo]}</span>
      <h2>${esc(b.nome || "Sem nome")}</h2>${corpo}</a>`;
  }
  function totaisMes(bid, m) {
    const ls = ((S.planilhas[bid] || {}).linhas || []).filter(l => mesDe(l.data) === m);
    let ent = 0, sai = 0; ls.forEach(l => { const v = Math.abs(Number(l.valor) || 0); if (l.tipo === "saida") sai += v; else ent += v; });
    return { ent, sai, n: ls.length };
  }

  // ---------- bloco ----------
  function topoBloco(b, r) {
    const conf = S.confirmar === "bloco:" + b.id;
    return `<header class="topo"><div class="topo-esq"><a class="voltar" href="#inicio" aria-label="Voltar pro quadro geral">${ICONE.voltar}</a>
        <div style="min-width:0;flex:1"><div class="trilha"><a href="#inicio">Quadro geral</a> › ${NOME_TIPO[b.tipo]}</div>
        <input class="titulo" id="bloco-nome" aria-label="Nome do bloco" value="${esc(b.nome)}" data-col="blocos" data-id="${b.id}" data-cam="nome" data-render="lado"></div></div>
      <div class="topo-dir">
        ${conf ? `<span class="sub" style="color:var(--texto-2)">Apagar o bloco e tudo dentro dele?</span><button class="btn perigo" data-acao="apagarBloco" data-id="${b.id}">Apagar de vez</button><button class="btn" data-acao="cancelar">Cancelar</button>`
               : `<button class="btn fantasma perigo peq" data-acao="confirmar" data-chave="bloco:${b.id}">Apagar bloco</button>`}
        <div class="abas"><a href="#b-${b.id}" class="${r.aba === "principal" ? "ativa" : ""}">${b.tipo === "conteudo" ? "Vídeos" : b.tipo === "planilha" ? "Planilha" : "Lista"}</a><a href="#b-${b.id}-mesa" class="${r.aba === "mesa" ? "ativa" : ""}">Mesa livre</a></div>
      </div></header>`;
  }
  function telaBloco(r) {
    const b = S.blocos[r.id];
    if (!b) return `<div class="chapa pontos"><div class="vazio"><h2>Esse bloco não existe mais</h2><p><a href="#inicio">Voltar pro quadro geral</a></p></div></div>`;
    const topo = topoBloco(b, r);
    if (r.aba === "mesa") return topo + htmlMesa("b-" + b.id);
    if (b.tipo === "planilha") return topo + telaPlanilha(b);
    if (b.tipo === "lista") return topo + telaLista(b);
    const subs = subsDe(b.id);
    const semSub = videosDe(b.id, "");
    const coluna = (s, vs) => `<section class="sn" aria-label="${esc(s ? s.nome : "Sem subnicho")}">
      <div class="sn-cab">${s ? `<input aria-label="Nome do subnicho" value="${esc(s.nome)}" data-col="subnichos" data-id="${s.id}" data-cam="nome">` : `<input value="Sem subnicho" disabled aria-label="Sem subnicho">`}
        <span class="n">${vs.length}</span>${s && !vs.length ? `<button class="x" data-acao="apagarSub" data-id="${s.id}" aria-label="Apagar subnicho">${ICONE.x}</button>` : ""}</div>
      ${vs.map(cartaoVideo).join("")}
      <button class="mais" data-acao="novoVideo" data-bloco="${b.id}" data-sub="${s ? s.id : ""}">+ Vídeo</button></section>`;
    return topo + `<div class="chapa pontos"><div class="colunas">
      ${subs.map(s => coluna(s, videosDe(b.id, s.id))).join("")}
      ${semSub.length || !subs.length ? coluna(null, semSub) : ""}
      <div class="sn-novo"><label class="etq" for="novo-sub" style="color:#3A372F">Novo subnicho</label><input id="novo-sub" type="text" placeholder="Ex.: Reviews de tech" autocomplete="off"><button class="mais" data-acao="novoSub" data-bloco="${b.id}">+ Subnicho</button></div>
    </div></div>`;
  }
  function cartaoVideo(v) {
    const ord = ["roteiro", "gravacao", "edicao"], e = v.etapa || "ideia";
    const idx = e === "publicado" ? 3 : ord.indexOf(e);
    return `<a class="papel video-cartao" href="#v-${v.id}"><b>${esc(v.titulo || "Vídeo sem título")}</b>
      <div class="etapas">${ord.map((o, i) => `<span class="${i < idx ? "ok" : i === idx ? "agora" : ""}">${NOME_ETAPA[o]}</span>`).join("")}</div>
      <span class="sub">${e === "publicado" ? "publicado" : e === "ideia" ? "só a ideia" : "em " + NOME_ETAPA[e].toLowerCase()}${v.formato === "reels" ? " · Reels" : ""}</span></a>`;
  }

  function telaPlanilha(b) {
    const pl = S.planilhas[b.id] || { linhas: [] };
    const ls = (pl.linhas || []).filter(l => mesDe(l.data) === S.mes).sort((x, y) => (x.data || "").localeCompare(y.data || ""));
    const t = totaisMes(b.id, S.mes);
    const cats = [...new Set((pl.linhas || []).map(l => l.categoria).filter(Boolean))];
    return `<div class="barra-abas"><div class="mes-nav"><button class="btn peq" data-acao="mes" data-d="-1" aria-label="Mês anterior">‹</button><b>${esc(nomeMes(S.mes))}</b><button class="btn peq" data-acao="mes" data-d="1" aria-label="Próximo mês">›</button></div>
      <button class="btn prim" data-acao="novaLinha" data-id="${b.id}">${ICONE.mais}Nova linha</button></div>
      <div class="chapa pontos">
      <div class="resumo"><div class="papel"><span class="etq" style="color:#6B6862">Entrou</span><b class="verde">${real(t.ent)}</b></div><div class="papel"><span class="etq" style="color:#6B6862">Saiu</span><b class="verm">${real(t.sai)}</b></div><div class="papel"><span class="etq" style="color:#6B6862">Sobrou</span><b>${real(t.ent - t.sai)}</b></div></div>
      <div class="papel tabela-caixa"><table class="tab"><thead><tr><th style="width:150px">Data</th><th>Descrição</th><th style="width:170px">Categoria</th><th style="width:120px">Tipo</th><th style="width:150px;text-align:right">Valor</th><th style="width:44px"></th></tr></thead><tbody>
      ${ls.map(l => `<tr>
        <td><input type="date" value="${esc(l.data)}" aria-label="Data" data-col="planilhas" data-id="${b.id}" data-cam="linhas.#${l.id}.data" data-render="1"></td>
        <td><input type="text" value="${esc(l.descricao)}" placeholder="Ex.: AdSense" aria-label="Descrição" data-col="planilhas" data-id="${b.id}" data-cam="linhas.#${l.id}.descricao"></td>
        <td><input type="text" list="cats-${b.id}" value="${esc(l.categoria)}" placeholder="Ex.: Ferramentas" aria-label="Categoria" data-col="planilhas" data-id="${b.id}" data-cam="linhas.#${l.id}.categoria"></td>
        <td><select aria-label="Tipo" data-col="planilhas" data-id="${b.id}" data-cam="linhas.#${l.id}.tipo" data-render="1"><option value="entrada" ${l.tipo !== "saida" ? "selected" : ""}>Entrou</option><option value="saida" ${l.tipo === "saida" ? "selected" : ""}>Saiu</option></select></td>
        <td class="valor"><input type="text" inputmode="decimal" value="${l.valor ? String(l.valor).replace(".", ",") : ""}" placeholder="0,00" aria-label="Valor" data-col="planilhas" data-id="${b.id}" data-cam="linhas.#${l.id}.valor" data-tipo="num" data-render="blur"></td>
        <td><button class="x" data-acao="apagarLinha" data-id="${b.id}" data-linha="${l.id}" aria-label="Apagar linha">${ICONE.x}</button></td></tr>`).join("")}
      ${ls.length ? "" : `<tr><td colspan="6" style="padding:18px;color:#6B6862">Nada lançado em ${esc(nomeMes(S.mes))}. Use “Nova linha”.</td></tr>`}
      </tbody></table><datalist id="cats-${b.id}">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div></div>`;
  }
  function telaLista(b) {
    const it = (S.listas[b.id] || {}).itens || [];
    return `<div class="chapa pontos"><div class="papel lista">
      ${it.map(i => `<label class="${i.ok ? "feito" : ""}"><input type="checkbox" ${i.ok ? "checked" : ""} aria-label="Feito" data-col="listas" data-id="${b.id}" data-cam="itens.#${i.id}.ok" data-tipo="bool" data-render="1">
        <input type="text" value="${esc(i.t)}" aria-label="Item" data-col="listas" data-id="${b.id}" data-cam="itens.#${i.id}.t"><button class="x" data-acao="apagarItem" data-id="${b.id}" data-item="${i.id}" aria-label="Apagar item">${ICONE.x}</button></label>`).join("")}
      <div class="lista-add"><input id="novo-item" type="text" placeholder="Nova ideia ou tarefa" aria-label="Novo item" autocomplete="off"><button class="btn prim" data-acao="novoItem" data-id="${b.id}">Adicionar</button></div>
    </div></div>`;
  }

  // ---------- vídeo ----------
  function telaVideo(r) {
    const v = S.videos[r.id];
    if (!v) return `<div class="chapa pontos"><div class="vazio"><h2>Esse vídeo não existe mais</h2><p><a href="#inicio">Voltar pro quadro geral</a></p></div></div>`;
    const b = S.blocos[v.bloco] || {}; const s = S.subnichos[v.subnicho];
    const conf = S.confirmar === "video:" + v.id;
    const topo = `<header class="topo"><div class="topo-esq"><a class="voltar" href="#b-${v.bloco}" aria-label="Voltar pro bloco">${ICONE.voltar}</a>
        <div style="min-width:0;flex:1"><div class="trilha"><a href="#b-${v.bloco}">${esc(b.nome || "Bloco")}</a>${s ? " › " + esc(s.nome) : ""}</div>
        <input class="titulo" aria-label="Título do vídeo" value="${esc(v.titulo)}" placeholder="Título do vídeo" data-col="videos" data-id="${v.id}" data-cam="titulo"></div></div>
      <div class="topo-dir">
        <select class="sel" aria-label="Etapa" data-col="videos" data-id="${v.id}" data-cam="etapa" data-render="1">${ETAPAS.map(([k, n]) => `<option value="${k}" ${v.etapa === k ? "selected" : ""}>${n}</option>`).join("")}</select>
        <select class="sel" aria-label="Formato" data-col="videos" data-id="${v.id}" data-cam="formato">${[["youtube", "YouTube 16:9"], ["reels", "Reels 9:16"]].map(([k, n]) => `<option value="${k}" ${v.formato === k ? "selected" : ""}>${n}</option>`).join("")}</select>
        <select class="sel" aria-label="Subnicho" data-col="videos" data-id="${v.id}" data-cam="subnicho" data-render="1"><option value="">Sem subnicho</option>${subsDe(v.bloco).map(x => `<option value="${x.id}" ${v.subnicho === x.id ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select>
      </div></header>
      <div class="barra-abas"><div class="abas">${[["mesa", "Mesa livre"], ["roteiro", "Roteiro"], ["gravacao", "Gravação"], ["edicao", "Edição"]].map(([k, n]) => `<a href="#v-${v.id}${k === "mesa" ? "" : "-" + k}" class="${r.aba === k ? "ativa" : ""}">${n}</a>`).join("")}</div>
        ${conf ? `<span style="display:flex;gap:8px;align-items:center"><span class="sub" style="color:var(--texto-2)">Apagar este vídeo?</span><button class="btn perigo peq" data-acao="apagarVideo" data-id="${v.id}">Apagar de vez</button><button class="btn peq" data-acao="cancelar">Cancelar</button></span>`
               : `<button class="btn fantasma perigo peq" data-acao="confirmar" data-chave="video:${v.id}">Apagar vídeo</button>`}</div>`;
    if (r.aba === "roteiro") return topo + abaRoteiro(v);
    if (r.aba === "gravacao") return topo + abaGravacao(v);
    if (r.aba === "edicao") return topo + abaEdicao(v);
    return topo + htmlMesa("v-" + v.id);
  }
  function boxPedido(v, para) {
    const nome = para === "roteirista" ? "Roteirista" : "Editor";
    const ps = Object.values(S.pedidos).filter(p => p.videoId === v.id && p.para === para).sort((a, b) => (b.criado || "").localeCompare(a.criado || ""));
    return `<section class="caixa-escura" aria-label="Pedido pro ${nome}"><span class="etq">Pedido pro ${nome}</span>
      <label class="sub" for="pedido-${para}" style="color:var(--texto-3)">O que você quer que o ${nome} faça neste vídeo?</label>
      <textarea id="pedido-${para}" placeholder="${para === "roteirista" ? "Ex.: deixar a abertura mais direta" : "Ex.: cortar mantendo o último take de cada fala"}"></textarea>
      <button class="btn prim" data-acao="enviarPedido" data-para="${para}" data-id="${v.id}">${ICONE.envio}Mandar pro ${nome}</button>
      ${ps.map(p => `<div class="pedido"><span class="st ${p.estado === "feito" ? "feito" : p.estado === "andamento" ? "andamento" : "aberto"}">${p.estado === "feito" ? "feito" : p.estado === "andamento" ? "o " + nome + " tá fazendo" : "aguardando o " + nome}</span><span>${esc(p.texto)}</span>${p.resposta ? `<span class="resp">${esc(p.resposta)}</span>` : ""}</div>`).join("")}
      <span class="sub" style="color:var(--texto-3)">O chat do ${nome} lê este pedido na pasta sincronizada e responde aqui.</span></section>`;
  }
  function abaRoteiro(v) {
    const rot = v.roteiro || [];
    const tot = rot.reduce((n, b) => n + palavras(b.texto), 0);
    return `<div class="chapa pontos"><div class="duas"><div class="principal">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between"><span class="etq" style="color:#B80B20">Roteiro · ${rot.length} blocos</span><span class="tempo">${tot} palavras · ~${tempoFala(tot)} de fala</span></div>
      ${rot.map((b, i) => `<article class="papel rot">
        <div class="rot-cab"><input aria-label="Título do bloco" value="${esc(b.titulo)}" placeholder="Nome do bloco" data-col="videos" data-id="${v.id}" data-cam="roteiro.#${b.id}.titulo">
          <span class="tempo">~${tempoFala(palavras(b.texto))}</span>
          <button class="x" data-acao="moverRot" data-id="${v.id}" data-rot="${b.id}" data-d="-1" aria-label="Subir bloco" ${i === 0 ? "disabled" : ""}>${ICONE.cima}</button>
          <button class="x" data-acao="moverRot" data-id="${v.id}" data-rot="${b.id}" data-d="1" aria-label="Descer bloco" ${i === rot.length - 1 ? "disabled" : ""}>${ICONE.baixo}</button>

  // ---------- campos (todo input com data-col salva sozinho) ----------
  function caminhar(obj, cam, valor) {
    const partes = cam.split(".");
    let o = obj;
    for (let i = 0; i < partes.length - 1; i++) {
      const p = partes[i];
      if (p.startsWith("#")) { o = (o || []).find(x => x.id === p.slice(1)); }
      else { if (o[p] == null) o[p] = {}; o = o[p]; }
      if (!o) return false;
    }
    const ult = partes[partes.length - 1];
    if (ult.startsWith("#")) return false;
    o[ult] = valor; return true;
  }
  function aplicarCampo(el) {
    const col = el.dataset.col, id = el.dataset.id; if (!col || !id) return;
    const doc = clone(S[col][id] || {});
    let val = el.dataset.tipo === "bool" ? el.checked : el.value;
    if (el.dataset.tipo === "num") { const n = parseFloat(String(val).replace(/\./g, "").replace(",", ".")); val = isFinite(n) ? n : 0; }
    if (!caminhar(doc, el.dataset.cam, val)) return;
    gravar(col, id, doc, el.dataset.tipo === "bool" || el.tagName === "SELECT" ? 150 : 600);
    const rr = el.dataset.render;
    if (rr === "lado") renderLado();
    else if (rr === "1") pedirRender();
    else if (rr === "blur") el.addEventListener("blur", () => pedirRender(), { once: true });
  }

  // ================= MESA LIVRE =================
  function htmlMesa(mid) {
    return `<div class="mesa" data-mesa="${mid}">
      <div class="ferramentas" role="toolbar" aria-label="Adicionar à mesa">${FERRAMENTAS.map(([k, n, p]) => `<button type="button" class="ferr ${S.ligando && k === "linha" ? "ativa" : ""}" data-novo="${k}" aria-label="${n}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${p}</svg>${n}</button>`).join("")}</div>

  }
  const mesaDados = mid => S.mesas[mid] || { itens: [], linhas: [] };
  function salvarMesa(mid, m) {
    const ant = S.mesas[mid] || { itens: [], linhas: [] }, t = agora();
    m.apagados = { ...(m.apagados || {}) };
    const marcar = (lista, velhas) => {
      const mv = new Map((velhas || []).map(i => [i.id, i]));
      (lista || []).forEach(i => { const v = mv.get(i.id); const a = { ...i }; delete a.alt; const b = v ? { ...v } : null; if (b) delete b.alt; if (!b || JSON.stringify(a) !== JSON.stringify(b)) i.alt = t; mv.delete(i.id); });
      mv.forEach((_, id) => { m.apagados[id] = t; });
    };
    marcar(m.itens, ant.itens); marcar(m.linhas, ant.linhas);
    gravar("mesas", mid, m);
  }
  function itemPorId(m, id) { return (m.itens || []).find(i => i.id === id); }

  function htmlItem(it, m) {
    const sel = S.sel === it.id ? " sel" : "", de = S.ligando && S.ligando.de === it.id ? " de" : "";
    const pos = it.col ? "" : `left:${it.x || 0}px;top:${it.y || 0}px;`;
    const st = `style="${pos}width:${it.w || 220}px"`;
    const menu = S.sel === it.id ? `<div class="it-menu">${it.tipo === "nota" ? ["amarela", "branca", "vermelha", "verde", "azul"].map(c => `<button type="button" data-it-acao="cor" data-valor="${c}" aria-label="Cor ${c}"><span class="bola nota ${c}" style="padding:0;box-shadow:none"></span></button>`).join("") : ""}${["imagem", "link"].includes(it.tipo) ? `<button type="button" data-it-acao="editar" aria-label="Editar">✎</button>` : ""}<button type="button" data-it-acao="apagar" aria-label="Apagar">${ICONE.x}</button></div>` : "";
    const ed = (campo, vazio, extra = "") => `<div class="txt ${extra}" data-edita="${campo}" data-vazio="${vazio}">${esc(campo.split(".").reduce((o, k) => o == null ? o : o[k], it) || "")}</div>`;
    switch (it.tipo) {
      case "nota": return `<div class="it nota ${it.cor || "amarela"}${sel}${de}" data-it="${it.id}" ${st}>${menu}${ed("texto", "Dois cliques pra escrever")}</div>`;
      case "texto": return `<div class="it texto-solto${sel}${de}" data-it="${it.id}" ${st}>${menu}${ed("texto", "Texto solto")}</div>`;
      case "coluna": {
        const filhos = (it.filhos || []).map(fid => itemPorId(m, fid)).filter(Boolean);
        return `<div class="it coluna${sel}${de}" data-it="${it.id}" ${st}>${menu}${ed("titulo", "Coluna", "col-tit")}<div class="col-corpo">${filhos.map(f => htmlItem(f, m)).join("")}</div>${filhos.length ? "" : `<div class="col-vazia">Arraste cartões pra cá</div>`}</div>`;
      }

        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn prim" data-acao="salvarChave">Salvar e sincronizar</button>
          <button class="btn" style="color:var(--papel-tinta);background:var(--papel-2);border-color:#DCD7CD" data-acao="sincronizarAgora" ${cfg.token ? "" : "disabled"}>Sincronizar agora</button>
          ${cfg.token ? `<button class="btn fantasma" style="color:var(--vermelho-esc);border-color:#DCD7CD" data-acao="tirarChave">Tirar a chave deste aparelho</button>` : ""}
        </div>
      </section>
      <section class="papel rot" aria-label="Como criar a chave">
        <b style="font:700 17px var(--f-titulo)">Como criar a chave (uma vez só)</b>
        <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.5">
          <li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--vermelho-esc)">github.com/settings/personal-access-tokens/new</a> logado na conta <b>${esc(cfg.dono)}</b>.</li>
          <li>Em <b>Token name</b>, escreva <b>FluxoEDITÁ</b>. Em <b>Expiration</b>, escolha a validade mais longa.</li>
          <li>Em <b>Repository access</b>, marque <b>Only select repositories</b> e escolha <b>${esc(cfg.repo)}</b>.</li>
          <li>Em <b>Permissions › Repository permissions</b>, ache <b>Contents</b> e troque pra <b>Read and write</b>.</li>
          <li>Clique em <b>Generate token</b>, copie a chave e cole no campo acima. Use a mesma chave no celular e no Mac.</li>
        </ol>
        <span class="sub">A chave fica guardada só no seu aparelho e serve apenas pra essa pasta privada.</span>
      </section>
    </div><aside class="aside">
      <section class="caixa-escura"><span class="etq">Instalar no iPhone</span>
        <span>No Safari, abra este endereço, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</span>
        <span class="sub" style="color:var(--texto-3)">Depois de instalado, ele abre e funciona sem internet.</span></section>
      <section class="caixa-escura"><span class="etq">No Mac</span>
        <span>Use o app <b>FluxoEDITÁ</b> do Mac. Se preferir pelo navegador: no Safari, <b>Arquivo › Adicionar ao Dock</b>.</span></section>
      <section class="caixa-escura"><span class="etq">Cópia de segurança</span>
        <span>Baixa um arquivo com todos os seus blocos, vídeos e mesas.</span>
        <button class="btn" data-acao="exportar">Baixar cópia (.json)</button></section>
    </aside></div></div>`;
  }
  Object.assign(acoes, {
    salvarChave: () => {
      const v = ($("#cfg-token").value || "").trim();
      if (!v && !cfg.token) { mostrar("Cole a chave do GitHub primeiro"); return; }
      if (v) cfg.token = v;
      guardarAgora(); estadoSync = "parado"; render(); sincronizar(true);
    },
    sincronizarAgora: () => sincronizar(true),
    tirarChave: () => { cfg.token = ""; guardarAgora(); estadoSync = "sem-chave"; render(); mostrar("Chave tirada deste aparelho"); },
    exportar: () => {
      const blob = new Blob([JSON.stringify({ versao: 1, exportado: agora(), colecoes: Object.fromEntries(COLECOES.map(c => [c, S[c]])) }, null, 1)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fluxoedita-" + hoje() + ".json"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
  });

  // ---------- início ----------
  function iniciar() {
    if (window.FLUXO_MAC) document.documentElement.classList.add("mac");
    const est = lerLocal();
    if (est && est.colecoes) { COLECOES.forEach(c => { S[c] = est.colecoes[c] || {}; }); apagados = est.apagados || {}; ultimaSync = est.ultimaSync || null; mudouDesdeSync = !!est.mudouDesdeSync; }
    if (est && est.cfg) cfg = { ...CFG_PADRAO, ...est.cfg };
    modo = "local"; COLECOES.forEach(c => S.carregou.add(c));
    estadoSync = cfg.token ? "parado" : "sem-chave";
    render();
    sincronizar();
    setInterval(() => { if (document.visibilityState === "visible") sincronizar(); else atualizarSalvo(); }, 60000);
    setInterval(atualizarSalvo, 30000);
    window.addEventListener("online", () => sincronizar());
    window.addEventListener("offline", () => { estadoSync = cfg.token ? "offline" : "sem-chave"; atualizarSalvo(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sincronizar(); else { guardarAgora(); if (mudouDesdeSync) sincronizar(); } });
    window.addEventListener("pagehide", guardarAgora);
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => { });
  }
  iniciar();
})();
</script>
</body>
</html>
